<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 15mm;
      @bottom-right {
        content: counter(page) " / " counter(pages);
        font-size: 9pt;
        color: #718096;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11pt;
      line-height: 1.5;
      color: #2d3748;
      background-color: #ffffff;
      padding: 0;
    }

    header {
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 20pt;
      font-weight: 700;
      color: #1a202c;
    }

    main {
      margin-top: 16px;
    }

    p {
      margin-bottom: 12px;
    }

    @media print {
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .page-break {
        page-break-after: always;
        break-after: page;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
  </header>
  <main>
    {% if content %}
      <p>{{ content }}</p>
    {% else %}
      <p>This is a barebones document bundle rendered with iwe.</p>
    {% endif %}
  </main>
</body>
</html>
